user nginx;
worker_processes auto;
events {
    use epoll;
    worker_connections 100000;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;
    access_log /dev/stdout;
    error_log /dev/stdout debug;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile on;
    keepalive_timeout 70;
    client_max_body_size 50G;
    client_header_buffer_size 128k;
    large_client_header_buffers 4 128k;


    # 明确设置 Brotli 优先级
    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Gzip 作为降级方案
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 统一全局代理请求头：透传真实 Host、客户端真实 IP 与协议
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen  80;
        server_name frontend;
        index index.html;
        root /usr/share/nginx/html;

        location ^~ /api/iam {
            set $upstream_iam "http://eiam:8000";
            rewrite ^/api/iam(.*)$ /api$1 break;
            proxy_pass $upstream_iam;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 1. 插件运行时专线（包含 Web 终端长连接、SFTP 流、插件静态资源托管）
        # 采用最长前缀 ^~ 匹配：专属 1 小时长超时 + 彻底关闭缓冲 + 绝对防止被底部静态正则拦截
        location ^~ /api/cmdb/plugin-runtime/ {
            set $upstream_cmdb "http://ecmdb:8000";
            rewrite ^/api/cmdb(.*)$ /api$1 break;
            proxy_pass $upstream_cmdb;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering "no" always;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # 2. CMDB 普通业务接口：保留 ^~ 修饰符，保持默认缓冲保护与常规超时
        location ^~ /api/cmdb {
            set $upstream_cmdb "http://ecmdb:8000";
            rewrite ^/api/cmdb(.*)$ /api$1 break;
            proxy_pass $upstream_cmdb;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ^~ /api/ticket {
            set $upstream_iam "http://eflow:8000";
            rewrite ^/api/ticket(.*)$ /api$1 break;
            proxy_pass $upstream_iam;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ^~ /api/alert {
            set $upstream_alert "http://ealert:8000";
            rewrite ^/api/alert(.*)$ /api$1 break;
            proxy_pass $upstream_alert;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # SSE 流接口必须逐帧转发；同时将 X-Accel-Buffering 显式返回给
        # 可能存在的外层 HTTPS 反向代理，避免双层 Nginx 再次缓冲。
        location ^~ /api/task/streams/ {
            set $upstream_task "http://etask:8000";
            rewrite ^/api/task(.*)$ /api$1 break;
            proxy_pass $upstream_task;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
            add_header X-Accel-Buffering "no" always;
        }

        location /api/task {
            set $upstream_task "http://etask:8000";
            rewrite ^/api/task(.*)$ /api$1 break;
            proxy_pass $upstream_task;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ^~ /minio {
            set $upstream_minio "http://minio:9000";
            rewrite ^/minio(/.*)$ $1 break;
            proxy_pass $upstream_minio;
            
            # 覆盖全局继承的 $http_host，否则导致 MinIO 签名校验失败
            proxy_set_header Host $proxy_host;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Vary Accept-Encoding always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带 hash 的构建资源可以长期缓存；缺失的静态资源直接 404，避免回退成 index.html。
        # 明确排除 /api/ 前缀，防止以 .js/.css 结尾的 API 路径（如插件静态资源 proxy）
        # 被 try_files $uri =404 在本地文件系统查找并错误地返回 404。
        location ~* ^(?!/api/).*\.(?:js|css|json|xml|ico|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary Accept-Encoding always;
            try_files $uri =404;
        }
    }
}
