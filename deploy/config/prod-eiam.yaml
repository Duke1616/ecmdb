log:
  debug: true

web:
  host: "0.0.0.0"
  port: 8000

grpc:
  server:
    eiam:
      name: "eiam"
      listen_addr: "0.0.0.0:8077"
      auth_token: "1234567890"

mysql:
  dsn: "eiam:123456@tcp(mysql:3306)/eiam?charset=utf8mb4&parseTime=True&loc=Local"

# 会话与 Cookie 配置
session:
  session_encrypted_key: "1234567890Key"
  # 可选值：cookie（默认）或 token。token 模式使用 Authorization: Bearer。
  # 如何使用 cookie 你需要提供正确的 domain， 如何是 http 需要 secure: false
  token_carrier: "token"
  cookie:
    domain: ".example.com"
    name: "ecmdb-token-key"
    secure: true

# 缓存配置 (Redis)
redis:
  addr: "redis:6379"
  password: "1234567890"
  db: 1

# 注册中心配置 (Etcd)
etcd:
  endpoints:
    - etcd:2379

# 密码加密
identity:
  encryption_key: 1234567890

discovery:
  # 微服务 API 资产自发现注册端点认证
  # 密钥通过 `eiam token gen --service <name>` 命令生成
  auth_enabled: false

casbin:
  redis:
    addr: "redis:6379"
    password: "1234567890"
    db: 2

# 操作与安全审计
audit:
  enabled: true
  # 审计拦截的 HTTP 方法 (记录增删改等写操作，GET 查看类可按需解开)
  methods:
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    # - "GET"

# 统一身份提供商 (IdP)
idp:
  # 统一公共配置 (所有身份协议共享)
  login_url: "/login"

  # OIDC 协议专有配置
  oidc:
    # 签发者地址，须与客户端配置保持一致 (对外访问地址)
    issuer_url: "http://localhost:8888"
    # JWT 签名密钥标识
    key_id: "eiam-default-key"
    # RSA 私钥 (支持 PEM 内容或私钥文件路径，为空则自动集群生成)
    private_key: ""
    # 授权确认页地址 (为空则使用默认内置页)
    consent_url: ""
    # 是否启用 OIDC 单点注销端点广播 (SLO)
    enable_slo: false

  # SAML 2.0 协议专有配置
  saml:
    # 外部 X.509 证书 (支持 PEM 文本或 .crt 文件路径，为空则自动集群自签)
    certificate: ""
    # 外部 RSA 私钥 (支持 PEM 文本或 .key 文件路径，为空则默认复用 OIDC 私钥或集群生成)
    private_key: ""
    # 自签名证书有效天数
    validity_days: 1095

  # CAS 协议专有配置
  cas:
    # 票据有效时长 (分钟)
    ticket_ttl_minutes: 5

migration:
  source:
    mongo:
      dsn: "mongodb://ecmdb:123456@mongo:27017/ecmdb?authSource=admin"
      database: "ecmdb"
  identity:
    version: "V1"
    key: "1234567890"
  batch_size: 100
  timeout: "10m"
  reset_auto_increment: true
  truncate: false
  dry_run: false
