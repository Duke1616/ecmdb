log:
  debug: true

web:
  host: "0.0.0.0"
  port: 8000

grpc:
  server:
    eiam:
      name: "eiam"
      listen_addr: "0.0.0.0:8077"
      auth_token: "1234567890"

mysql:
  dsn: "eiam:123456@tcp(mysql:3306)/eiam?charset=utf8mb4&parseTime=True&loc=Local"

# 会话与 Cookie 配置
session:
  session_encrypted_key: "1234567890Key"
  # 可选值：cookie（默认）或 token。token 模式使用 Authorization: Bearer。
  # 如何使用 cookie 你需要提供正确的 domain， 如何是 http 需要 secure: false
  token_carrier: "token"
  cookie:
    domain: ".example.com"
    name: "ecmdb-token-key"
    secure: true

# 缓存配置 (Redis)
redis:
  addr: "redis:6379"
  password: "1234567890"
  db: 1

# 注册中心配置 (Etcd)
etcd:
  endpoints:
    - etcd:2379

# 密码加密
identity:
  encryption_key: 1234567890

casbin:
  redis:
    addr: "redis:6379"
    password: "1234567890"
    db: 2

# 统一身份提供商 (IdP / OIDC Server)
idp:
  # OIDC 签发者地址，须与客户端配置的 issuer 保持一致 (对外访问地址)
  issuer_url: "http://localhost:8888"
  # 未登录重定向地址
  login_url: "/login"
  # JWT 签名密钥标识
  key_id: "eiam-default-key"

# 操作与安全审计
audit:
  # 是否开启操作审计
  enabled: true
  # 审计拦截的 HTTP 方法 (记录增删改等写操作，GET 查看类可按需解开)
  methods:
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    # - "GET"

migration:
  source:
    mongo:
      dsn: "mongodb://ecmdb:123456@mongo:27017/ecmdb?authSource=admin"
      database: "ecmdb"
  identity:
    version: "V1"
    key: "1234567890"
  batch_size: 100
  timeout: "10m"
  reset_auto_increment: true
  truncate: false
  dry_run: false
