# etask 全量配置文件 (all-in-one 模式示例)

# 日志配置
log:
  debug: true # 是否开启调试模式，开启后会打印更多详细日志

# web 配置: 对外暴露 http 接口
web:
  host: "0.0.0.0"
  port: 8000

# 数据加密配置：针对敏感字段进行 AES 加密存储
encryption:
  version: "V1" # 加密算法版本
  key: "1234567890"

# 策略鉴权：IAM服务地址，用于登录验证与权限鉴权
policy:
  auth_url: http://eiam:8000
  discovery_url: http://eiam:8000

# gRPC 服务及客户端配置
grpc:
  server:
    # 调度中心 gRPC Server 配置
    scheduler:
      name: scheduler # 注册到 Etcd 的服务名称
      listen_addr: "0.0.0.0:9002" # 监听端口
      advertise_addr: ""  # 广播地址，留空则自动探测物理 IP
      auth_token: "1234567890" # JWT 认证 Token，留空则不开启
    # 执行器 gRPC Server 配置
    executor:
      name: execute # 执行器分组名称
      listen_addr: "0.0.0.0:9004" # 监听端口
      advertise_addr: ""  # 广播地址
      auth_token: "1234567890" # JWT 认证 Token
  client:
    # Executor、Agent 访问 Scheduler
    scheduler:
      name: scheduler
      auth_token: "1234567890"
    # 支持消息通知
    ealert:
      name: ealert
      auth_token: "1234567890"

# 制品仓库：发布后的不可变代码包存储在 MinIO，由 MinIO 数据卷负责持久化。
artifact:
  temp_dir: "/tmp/etask/artifacts"
  storage:
    driver: "s3"
    s3:
      endpoint: "http://minio:9000"
      region: "us-east-1"
      bucket: "etask-artifacts"
      prefix: "codebook"
      access_key: "minio"
      secret_key: "minio123"

# Agent 和 Executor 共享本地制品缓存；缓存丢失后可以从 MinIO 自动重建。
artifact_cache:
  dir: "/tmp/etask/artifact-cache"
  max_download_size: "512MB"
  max_unpacked_size: "2GB"
  max_file_count: 10000
  max_cache_size: "10GB"

# Agent 和 Executor 共享 Shell/Python 脚本运行时。
runtime:
  workspace_dir: "/tmp/etask/runs"
  workspace_max_age: 24h
  shell:
    enabled: true
    binary: "/bin/bash"
  python:
    enabled: true
    binary: "python"
  ansible:
    enabled: true
    binary: "ansible-playbook"
    # 密码凭据依赖该命令；默认值为 sshpass。
    # sshpass_binary: "sshpass"
    # credential_root: "/run/credentials/etask-ansible"
    # known_hosts_file: "/etc/etask/ssh/known_hosts"
    # credentials:
    #   production-linux:
    #     type: "private_key"
    #     username: "etask"
    #     private_key_file: "production-linux-key"
    #   legacy-linux:
    #     type: "password"
    #     username: "root"
    #     password_file: "legacy-linux-password"
  # root 运行时自动将脚本降权；required 可用于强制生产节点校验。
  sandbox:
    mode: auto
    uid: 65534
    gid: 65534
  max_code_size: "4MB"
  max_args_size: "1MB"
  max_variables_size: "1MB"
  max_log_line_size: "1MB"
  max_result_size: "4MB"
  archive:
    enabled: true
    failed_only: true
    dir: "/tmp/etask/script-archive"
    max_age: 168h
    max_size: "10GB"

# Agent 模块配置 (基于 Kafka 队列的异步执行器)
agent:
  # 实例显示名称
  name: Kafka-Agent
  # 监听的任务消息队列 Topic
  topic: agent_execute
  # 并发消费任务数量
  worker_count: 4
  # 描述信息，展示在管理后台
  desc: 异步任务执行代理：负责从消息队列拉取并执行来自调度中心的任务指令
  # 资源池隔离级别：SHARED(共享) 或 DEDICATED(专有)
  isolation_level: "SHARED"

# 执行节点集群配置
executor:
  # 节点实例 ID。
  # 优先级：EXECUTOR_NODE_ID > executor.id > grpc.server.executor.id。
  # 注意：系统会自动将其格式化为 {serviceName}:{id}，如 "etask:node-01"，以确保跨服务唯一。
  id: "node-01"
  # 任务执行模式：
  # - PUSH: (默认) 调度中心检测到节点在线后，主动向节点推送任务请求，适用于公网可达的环境。
  # - PULL: 边缘节点模式。节点主动向中心发起长轮询拉取任务，适用于防火墙内或无固定公网 IP 的环境。
  mode: "PUSH"
  # 执行器集群功能描述。
  desc: "通用计算节点：提供 Shell 与 Python 脚本等系统级基础执行能力的默认执行器集群"
  # 资源池隔离级别：SHARED(共享) 或 DEDICATED(专有)
  isolation_level: "SHARED"


# 数据库配置 (MySQL)
mysql:
  dsn: "etask:123456@tcp(mysql:3306)/etask?charset=utf8mb4&parseTime=True&loc=Local"

# 缓存配置 (Redis)
redis:
  addr: "redis:6379"
  password: "1234567890"
  db: 0

# 消息队列配置 (Kafka)
kafka:
  network: tcp
  addresses:
    - kafka:9092

# 注册中心配置 (Etcd)
etcd:
  endpoints:
    - etcd:2379

# 调度引擎核心参数
scheduler:
  # 批量获取任务的超时时间
  batch_timeout: 3s
  # 每次调度循环扫描的最大任务数
  batch_size: 100
  # 任务抢占超时时间
  preempted_timeout: 10m
  # 核心调度循环间隔
  schedule_interval: 10s
  # 任务续约间隔
  renew_interval: 5s
  # 单个 Scheduler 节点允许同时发起的最大执行调用数
  max_concurrent_tasks: 1000
  # 任务执行令牌获取超时时间
  token_acquire_timeout: 3s


# 补偿机制相关配置
compensator:
  # 重试补偿：处理执行失败的任务
  retry:
    batch_size: 100 # 单次补偿扫描的任务量
    min_duration: 1s # 两次补偿执行的最小间隔
  # 重新调度补偿：处理抢占成功但节点宕机未运行的任务
  reschedule:
    batch_size: 100
    min_duration: 1s
  # 中断补偿：处理需要强行终止的任务
  interrupt:
    batch_size: 100
    min_duration: 1s
  # 终止信号：手动停止任务
  termination:
    batch_size: 100
    min_duration: 1s

migration:
  source:
    mongo:
      dsn: "mongodb://ecmdb:123456@mongo:27017/ecmdb?authSource=admin"
      database: "ecmdb"
  batch_size: 100
  timeout: "10m"
  auto_migrate: true
  reset_auto_increment: true
  truncate: false
  dry_run: false
